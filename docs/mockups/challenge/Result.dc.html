<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Итог вызова</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: center; height: 56px"><span style="font-size: 16px; font-weight: 600">Вызов с Аней</span></header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">Сдам ли я матанализ на 4 или 5 до 25 января?</h1>
    <section style="background: {{t.card}}; border-radius: 16px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <span style="font-size: 15px; color: {{t.sub}}">Ты выиграл</span>
      <span style="font-size: 40px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums">+98</span>
      <span style="font-size: 14px; color: {{t.sub}}">Итог: <span style="font-weight: 700; color: {{t.yes}}">ДА</span> — оба ответили одинаково</span>
    </section>
    <section style="background: {{t.card}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Банк</span><span style="font-weight: 600">100</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Комиссия 2%</span><span style="font-weight: 600">−2</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Твоя ставка в банке</span><span style="font-weight: 600">50</span></div>
    </section>
    <span style="font-size: 13px; line-height: 1.45; color: {{t.sub}}; text-align: center">Вызовы не входят в рейтинг и статистику прогнозов.</span>
  </div>
  <footer style="padding: 12px 16px 20px"><button style="width: 100%; height: 52px; border: none; border-radius: 14px; background: {{t.ink}}; color: {{t.bg}}; font: 600 16px Inter, system-ui, sans-serif">Вызвать ещё раз</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { t: dark
      ? { bg: '#0E1014', card: '#181B21', ink: '#F1F3F5', sub: '#9AA3AE', yes: '#7DB0FF' }
      : { bg: '#F2F3F5', card: '#FFFFFF', ink: '#111418', sub: '#5F6672', yes: '#1A5FB8' } };
  }
}
</script>
</body>
</html>
