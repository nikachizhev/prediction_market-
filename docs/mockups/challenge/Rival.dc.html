<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Соперник уже ответил</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: center; height: 56px"><span style="font-size: 16px; font-weight: 600">Вызов с Кириллом</span></header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">Сдам ли я матанализ на 4 или 5 до 25 января?</h1>
    <section style="background: {{t.card}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 18px; font-weight: 700">Кирилл указал: ДА</span>
      <span style="font-size: 14px; line-height: 1.45; color: {{t.sub}}">Если ответишь ДА, Кирилл получит 98. Не ответишь за 23 часа — его ответ встанет сам.</span>
      <button style="height: 52px; border: none; border-radius: 12px; background: {{t.ink}}; color: {{t.bg}}; font: 600 16px Inter, system-ui, sans-serif">Согласен: ДА</button>
    </section>
    <section style="background: {{t.card}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 15px; font-weight: 600">Не согласен?</span>
      <span style="font-size: 14px; line-height: 1.45; color: {{t.sub}}">Другой ответ откроет спор за 20 монет. Они вернутся, если модератор признает твою правоту.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 48px; border: 1px solid {{t.line}}; border-radius: 12px; background: transparent; color: {{t.no}}; font: 600 15px Inter, system-ui, sans-serif">НЕТ, спор за 20</button>
        <button style="height: 48px; border: 1px solid {{t.line}}; border-radius: 12px; background: transparent; color: {{t.ink}}; font: 600 15px Inter, system-ui, sans-serif">Отмена, спор за 20</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { t: dark
      ? { bg: '#0E1014', card: '#181B21', ink: '#F1F3F5', sub: '#9AA3AE', line: '#2A2E36', no: '#FF9E6B' }
      : { bg: '#F2F3F5', card: '#FFFFFF', ink: '#111418', sub: '#5F6672', line: '#E3E5E8', no: '#B23A0B' } };
  }
}
</script>
</body>
</html>
