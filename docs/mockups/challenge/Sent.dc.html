<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вызов отправлен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: center; height: 56px"><span style="font-size: 16px; font-weight: 600">Вызов</span></header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">Отправь вызов другу</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.sub}}">Ссылка одноразовая: вызов достанется первому, кто его примет.</p>
    <section style="background: {{t.card}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 17px; line-height: 1.3; font-weight: 600">Сдам ли я матанализ на 4 или 5 до 25 января?</span>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Ты за</span><span style="font-weight: 700; color: {{t.yes}}">ДА</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Ставка заморожена</span><span style="font-weight: 600">50</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: {{t.sub}}">Принять можно</span><span style="font-weight: 600">ещё 24 часа</span></div>
    </section>
    <button style="height: 52px; border: none; border-radius: 14px; background: {{t.ink}}; color: {{t.bg}}; font: 600 16px Inter, system-ui, sans-serif">Отправить другу</button>
    <button style="height: 44px; border: 1px solid {{t.line}}; border-radius: 12px; background: transparent; color: {{t.ink}}; font: 500 15px Inter, system-ui, sans-serif">Скопировать ссылку</button>
    <span style="font-size: 13px; line-height: 1.4; color: {{t.sub}}; text-align: center">Когда друг примет, бот напишет тебе.</span>
  </div>
  <footer style="padding: 12px 16px 20px"><button style="width: 100%; height: 44px; border: none; background: transparent; color: {{t.no}}; font: 500 15px Inter, system-ui, sans-serif">Отменить вызов и вернуть 50</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return { t: dark
      ? { bg: '#0E1014', card: '#181B21', ink: '#F1F3F5', sub: '#9AA3AE', line: '#2A2E36', yes: '#7DB0FF', no: '#FF9E6B' }
      : { bg: '#F2F3F5', card: '#FFFFFF', ink: '#111418', sub: '#5F6672', line: '#E3E5E8', yes: '#1A5FB8', no: '#B23A0B' } };
  }
}
</script>
</body>
</html>
