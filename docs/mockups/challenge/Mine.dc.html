<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вкладка вызовов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif">
  <header style="padding: 16px 16px 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 700">Мои</h1></header>
  <div role="tablist" aria-label="Разделы" style="display: flex; gap: 6px; padding: 0 16px 12px">
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border: none; border-radius: 999px; background: {{t.card}}; color: {{t.ink}}; font: 500 14px Inter, system-ui, sans-serif">Позиции</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border: none; border-radius: 999px; background: {{t.card}}; color: {{t.ink}}; font: 500 14px Inter, system-ui, sans-serif">Созданные</button>
    <button role="tab" aria-selected="true" style="height: 36px; padding: 0 12px; border: none; border-radius: 999px; background: {{t.ink}}; color: {{t.bg}}; font: 600 14px Inter, system-ui, sans-serif">Вызовы</button>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button style="text-align: left; border: none; border-radius: 16px; background: {{t.card}}; color: {{t.ink}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-family: inherit">
        <span style="font-size: 15px; line-height: 1.3; font-weight: 600">{{r.title}}</span>
        <span style="display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 13px"><span style="color: {{t.sub}}">{{r.sub}}</span><span style="font-weight: 600; color: {{r.ink}}">{{r.state}}</span></span>
      </button>
    </sc-for>
    <button style="margin-top: 6px; height: 52px; border: none; border-radius: 14px; background: {{t.ink}}; color: {{t.bg}}; font: 600 16px Inter, system-ui, sans-serif">Вызвать друга</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#0E1014', card: '#181B21', ink: '#F1F3F5', sub: '#9AA3AE', yes: '#7DB0FF', no: '#FF9E6B' }
      : { bg: '#F2F3F5', card: '#FFFFFF', ink: '#111418', sub: '#5F6672', yes: '#1A5FB8', no: '#B23A0B' };
    return { t: t, rows: [
      { title: 'Сдам ли я матанализ на 4 или 5 до 25 января?', sub: 'с Аней · 50', state: 'Чем закончилось?', ink: t.no },
      { title: 'Опоздает ли Петя на первую пару в понедельник?', sub: 'ждём соперника · 20', state: 'Ещё 18 часов', ink: t.sub },
      { title: 'Выйдет ли патч до конца недели?', sub: 'с Борей · 100', state: 'Спор у модератора', ink: t.no },
      { title: 'Победит ли наша группа в квизе?', sub: 'с Верой · 30', state: '+58,80', ink: t.yes },
    ] };
  }
}
</script>
</body>
</html>
