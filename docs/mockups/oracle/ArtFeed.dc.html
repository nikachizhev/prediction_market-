<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лента и свечи серии</title>
<script src="./support.js"></script>
<script src="./scene.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07060d; color: #EDE4D3; font-family: 'IBM Plex Mono', monospace">
  <canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; image-rendering: pixelated"></canvas>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; letter-spacing: 0.08em; color: #C9BFD8">зал предсказаний</span>
      <span style="font-size: 13px; font-weight: 600; color: #FFB03B">1 240 монет</span>
    </div>
    <h1 style="margin: 8px 0 0; font: 700 40px/1 'Cormorant Garamond', serif; text-shadow: 0 2px 18px #000">Что сбудется?</h1>

    <div style="margin-top: 172px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px">
      <span style="font-weight: 600; color: #FFD58A">горят 3 свечи из 7</span>
      <span style="color: #EDE4D3">завтра +35</span>
    </div>

    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
      <section style="background: rgba(9, 7, 18, 0.8); border: 1px solid rgba(255, 176, 59, 0.55); padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font: 700 21px/1.1 'Cormorant Garamond', serif">Колесо дня открыто</span>
          <span style="font-size: 12px; color: #C9BFD8">одно вращение, до полуночи</span>
        </span>
        <a href="ArtWheel.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; background: #FF4A32; color: #12060a; font-size: 13px; font-weight: 600; text-decoration: none">крутить</a>
      </section>

      <sc-for list="{{markets}}" as="m" hint-placeholder-count="2">
        <section style="background: rgba(9, 7, 18, 0.8); border: 1px solid rgba(190, 180, 230, 0.26); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
          <span style="font: 600 21px/1.15 'Cormorant Garamond', serif">{{m.title}}</span>
          <span style="position: relative; height: 4px; background: #8DB7FF; display: block">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{m.prob}}%; background: #FFB03B; display: block"></span>
          </span>
          <span style="display: flex; justify-content: space-between; font-size: 12px">
            <span style="color: #FFB03B; font-weight: 600">да {{m.prob}}%</span>
            <span style="color: #C9BFD8">{{m.people}} участников</span>
            <span style="color: #8DB7FF; font-weight: 600">нет {{m.no}}%</span>
          </span>
        </section>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Разделы" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: rgba(7, 6, 13, 0.92); border-top: 1px solid rgba(190, 180, 230, 0.26)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button aria-pressed="{{t.pressed}}" style="height: 56px; border: none; background: transparent; color: {{t.ink}}; font: {{t.weight}} 12px 'IBM Plex Mono', monospace">{{t.label}}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  setCanvas = (el) => {
    if (el && !this.scene && window.PMScene) {
      this.scene = window.PMScene.mount(el, { props: [{ type: 'candles', y: 124, lit: 3 }], fogY: 110, cones: [{ x: 60, color: [255, 176, 59], a: 0.42, w: 70, len: 0.4 }] });
    }
  };
  componentWillUnmount() {
    if (this.scene) this.scene.stop();
  }
  renderVals() {
    return {
      setCanvas: this.setCanvas,
      markets: [
        { title: 'Выйдет ли патч до конца недели?', prob: 64, no: 36, people: 12 },
        { title: 'Отменят ли зачёт по физике?', prob: 12, no: 88, people: 27 },
      ],
      tabs: ['лента', 'мои', 'создать', 'рейтинг', 'профиль'].map((label, i) => ({
        label, pressed: i === 0 ? 'true' : 'false', ink: i === 0 ? '#FF6A52' : '#C9BFD8', weight: i === 0 ? 600 : 400,
      })),
    };
  }
}
</script>
</body>
</html>
