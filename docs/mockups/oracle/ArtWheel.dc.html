<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Колесо дня</title>
<script src="./support.js"></script>
<script src="./scene.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07060d; color: #EDE4D3; font-family: 'IBM Plex Mono', monospace">
  <canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; image-rendering: pixelated"></canvas>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px 18px; display: flex; flex-direction: column">
    <h1 style="margin: 0; font: 700 40px/1 'Cormorant Garamond', serif; text-shadow: 0 2px 18px #000">Колесо дня</h1>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: stretch">
      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-shadow: 0 0 14px #000">
          <span style="font: 700 62px/1 'Cormorant Garamond', serif; color: #FFD58A">+25</span>
          <span style="font-size: 13px">новое вращение завтра</span>
        </div>
      </sc-if>
      <sc-if value="{{canSpin}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{spin}}" style="height: 58px; border: none; background: #FF4A32; color: #12060a; font: 600 16px 'IBM Plex Mono', monospace">крутить</button>
      </sc-if>
      <sc-if value="{{isSpinning}}" hint-placeholder-val="{{ false }}">
        <span style="height: 58px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #FFD58A; text-shadow: 0 0 10px #000">колесо решает…</span>
      </sc-if>

      <section style="background: rgba(9, 7, 18, 0.84); border: 1px solid rgba(190, 180, 230, 0.26); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{odds}}" as="o" hint-placeholder-count="5">
            <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; font-variant-numeric: tabular-nums">
              <span style="font: 700 22px/1 'Cormorant Garamond', serif; color: {{o.ink}}">{{o.value}}</span>
              <span style="font-size: 12px; color: #C9BFD8">{{o.chance}}</span>
            </span>
          </sc-for>
        </div>
        <span style="font-size: 12px; line-height: 1.4; color: #C9BFD8">размер долей равен шансам. вращение бесплатное, его нельзя купить. монеты нельзя вывести</span>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { phase: 'idle' };
  setCanvas = (el) => {
    if (el && !this.scene && window.PMScene) {
      this.scene = window.PMScene.mount(el, { embers: 0.8, props: [{ type: 'wheel', x: 97, y: 158, r: 76, angle: 0 }], fogY: 262, cones: [{ x: 97, color: [255, 90, 50], a: 0.7, w: 104, len: 0.72 }] });
    }
  };
  componentWillUnmount() {
    if (this.scene) this.scene.stop();
  }
  renderVals() {
    const { phase } = this.state;
    return {
      setCanvas: this.setCanvas,
      odds: [['5', '60%', '#C8C2FF'], ['10', '25%', '#C99BFF'], ['25', '10%', '#FF6A52'], ['50', '4%', '#FFB03B'], ['100', '1%', '#FFF1C2']]
        .map(([value, chance, ink]) => ({ value, chance, ink })),
      canSpin: phase === 'idle',
      isSpinning: phase === 'spinning',
      isDone: phase === 'done',
      // The server chooses; the wheel only shows its answer. Here: 25, the middle of its slice is at 324 degrees.
      spin: () => {
        this.setState({ phase: 'spinning' });
        if (this.scene) this.scene.spinTo('wheel', 1800 + 36, 3400, () => this.setState({ phase: 'done' }));
        else this.setState({ phase: 'done' });
      },
    };
  }
}
</script>
</body>
</html>
