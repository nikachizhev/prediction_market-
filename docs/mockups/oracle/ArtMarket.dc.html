<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рынок: шар вероятности</title>
<script src="./support.js"></script>
<script src="./scene.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07060d; color: #EDE4D3; font-family: 'IBM Plex Mono', monospace">
  <canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; image-rendering: pixelated"></canvas>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px 18px; display: flex; flex-direction: column">
    <span style="font-size: 12px; letter-spacing: 0.08em; color: #C9BFD8">технологии · 12 участников</span>
    <h1 style="margin: 8px 0 0; font: 700 34px/1.05 'Cormorant Garamond', serif; text-shadow: 0 2px 18px #000">Выйдет ли патч до конца недели?</h1>

    <div style="position: absolute; left: 0; right: 0; top: 262px; display: flex; flex-direction: column; align-items: center; gap: 0; text-shadow: 0 0 14px #000, 0 0 4px #000">
      <span style="font: 700 64px/1 'Cormorant Garamond', serif; color: #FFF4D6">64%</span>
      <span style="font-size: 12px; font-weight: 600; color: #FFD58A">шар видит да</span>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <section style="background: rgba(9, 7, 18, 0.82); border: 1px solid rgba(190, 180, 230, 0.26); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; color: #C9BFD8">как определяем результат</span>
        <span style="font: 500 18px/1.25 'Cormorant Garamond', serif">Да, если патч вышел в официальном магазине до конца воскресенья.</span>
      </section>
      <section style="background: rgba(9, 7, 18, 0.82); border: 1px solid rgba(190, 180, 230, 0.26); padding: 10px 14px; display: flex; align-items: center; gap: 12px">
        <span style="flex: none; width: 40px; height: 40px; box-sizing: border-box; border-radius: 999px; border: 2px solid #FFCD50; background: #2a1c06; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #FFCD50">А</span>
        <span style="display: flex; flex-direction: column; gap: 2px; font-size: 12px">
          <span style="font-weight: 600; color: #FFD58A">Аня · 1 место недели</span>
          <span style="color: #C9BFD8">разрешено 5 рынков · 0 проигранных споров</span>
        </span>
      </section>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 58px; border: 1px solid #FFB03B; background: rgba(255, 176, 59, 0.2); color: #FFC766; font: 700 26px 'Cormorant Garamond', serif">да</button>
        <button style="height: 58px; border: 1px solid #8DB7FF; background: rgba(141, 183, 255, 0.18); color: #A9CAFF; font: 700 26px 'Cormorant Garamond', serif">нет</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  setCanvas = (el) => {
    if (el && !this.scene && window.PMScene) {
      this.scene = window.PMScene.mount(el, { props: [{ type: 'orb', x: 97, y: 148, r: 54, p: 0.64 }], fogY: 215, cones: [{ x: 97, color: [255, 176, 59], a: 0.6, w: 92, len: 0.62 }] });
    }
  };
  componentWillUnmount() {
    if (this.scene) this.scene.stop();
  }
  renderVals() {
    return { setCanvas: this.setCanvas };
  }
}
</script>
</body>
</html>
