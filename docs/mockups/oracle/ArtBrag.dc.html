<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка-хвастовство</title>
<script src="./support.js"></script>
<script src="./scene.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #07060d; color: #EDE4D3; font-family: 'IBM Plex Mono', monospace">
  <canvas ref="{{setCanvas}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; image-rendering: pixelated"></canvas>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <span style="font-size: 12px; letter-spacing: 0.08em; color: #C9BFD8">сбылось</span>

    <div style="margin-top: 330px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-shadow: 0 0 16px #000">
      <span style="font: 700 92px/0.95 'Cormorant Garamond', serif; color: #FFD58A">+340</span>
      <span style="font-size: 14px; font-weight: 600">угадал с шансом 12%</span>
      <span style="margin-top: 10px; font: 600 26px/1.15 'Cormorant Garamond', serif">Отменят ли зачёт по физике?</span>
    </div>

    <div style="margin-top: auto; align-self: stretch; display: flex; flex-direction: column; gap: 8px">
      <button style="height: 58px; border: none; background: #FF4A32; color: #12060a; font: 600 16px 'IBM Plex Mono', monospace">поделиться</button>
      <span style="font-size: 12px; color: #C9BFD8; text-shadow: 0 0 8px #000">твой выигрыш увидят только те, кому отправишь</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  setCanvas = (el) => {
    if (el && !this.scene && window.PMScene) {
      this.scene = window.PMScene.mount(el, { embers: 0.75, props: [{ type: 'eye', x: 97, y: 100, r: 50 }], fogY: 180, cones: [{ x: 97, color: [255, 70, 50], a: 0.6, w: 112, len: 0.66 }] });
    }
  };
  componentWillUnmount() {
    if (this.scene) this.scene.stop();
  }
  renderVals() {
    return { setCanvas: this.setCanvas };
  }
}
</script>
</body>
</html>
