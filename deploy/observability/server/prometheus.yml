global:
  scrape_interval: 10s
  scrape_timeout: 8s
scrape_configs:
  - job_name: app
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: worker
    static_configs:
      - targets: ['127.0.0.1:9101']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19090']
