[Service]
RuntimeDirectory=pm-web-metrics
RuntimeDirectoryMode=0750
RuntimeDirectoryPreserve=no
Environment=PROMETHEUS_MULTIPROC_DIR=/run/pm-web-metrics
Environment=METRICS_ENABLED=1
ExecStart=
ExecStart=/opt/prediction_market/venv/bin/gunicorn config.wsgi --bind 127.0.0.1:8000 --workers 3 --timeout 60 --config /opt/prediction_market/app/deploy/observability/gunicorn.conf.py --access-logfile -
