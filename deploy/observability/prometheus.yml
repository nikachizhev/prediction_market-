global:
  scrape_interval: 10s
  scrape_timeout: 8s
scrape_configs:
  - job_name: app
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local-observability-scrape
    static_configs:
      - targets: ['app:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:9101']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
