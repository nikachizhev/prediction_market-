{% extends "base.html" %}
{% block content %}
<div class="auth-shell"><div class="card auth-card">
<h1>Восстановить пароль</h1>
<p>Введите почту, указанную при регистрации. Мы отправим ссылку для смены пароля.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Отправить ссылку</button></form>
<p><a href="{% url 'market:login' %}">Вернуться ко входу</a></p>
</div></div>
{% endblock %}
