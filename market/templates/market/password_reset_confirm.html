{% extends "base.html" %}
{% block content %}
<div class="auth-shell"><div class="card auth-card">
{% if validlink %}
<h1>Новый пароль</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Сохранить пароль</button></form>
{% else %}
<h1>Ссылка недействительна</h1>
<p>Ссылка устарела или уже использована.</p>
<a class="btn" href="{% url 'market:password_reset' %}">Запросить новую ссылку</a>
{% endif %}
</div></div>
{% endblock %}
